<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding Planning Checklist | Celebrations by Chanelle</title>
  <meta name="description" content="A printable wedding ceremony planning checklist from Celebrations by Chanelle.">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { --green: #1F3D2E; --sand: #D9C9B7; --brown: #6B4F3B; --cream: #F8F6F1; --muted: #5D6A60; --line: rgba(31, 61, 46, .15); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.12rem; line-height: 1.5; color: #26332B; background: var(--cream); }
    header { background: var(--green); color: var(--sand); text-align: center; padding: 3rem 1.25rem 2.5rem; }
    .script { font-family: 'Great Vibes', cursive; font-weight: 400; }
    header .script { font-size: clamp(3rem, 9vw, 4.5rem); line-height: 1; margin: 0; }
    .sub { font-family: 'Montserrat', sans-serif; font-size: .6rem; letter-spacing: .5em; text-transform: uppercase; margin: .3rem 0 1.6rem; }
    h1 { font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0; color: var(--cream); }
    main { max-width: 52rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    .actions { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .actions a, .actions button { font-family: 'Montserrat', sans-serif; font-size: .65rem; font-weight: 600; letter-spacing: .25em; text-transform: uppercase; padding: .9rem 1.5rem; border: 1px solid var(--green); background: none; color: var(--green); text-decoration: none; cursor: pointer; }
    .actions button { background: var(--green); color: var(--cream); }
    section { break-inside: avoid; margin-bottom: 2rem; }
    h2 { font-family: 'Montserrat', sans-serif; font-size: .7rem; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--brown); border-bottom: 1px solid var(--line); padding-bottom: .6rem; margin: 0 0 .8rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li label { display: flex; gap: .9rem; align-items: flex-start; padding: .45rem 0; cursor: pointer; }
    input[type="checkbox"] { appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 1.15rem; height: 1.15rem; margin-top: .25rem; border: 1px solid var(--green); border-radius: 3px; display: grid; place-items: center; cursor: pointer; }
    input[type="checkbox"]:checked { background: var(--green); }
    input[type="checkbox"]:checked::after { content: ''; width: .35rem; height: .6rem; border: solid var(--sand); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
    input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--sand); }
    .notes { border: 1px solid var(--line); min-height: 8rem; padding: 1rem; background: #fffdf9; }
    footer { text-align: center; color: var(--muted); padding-bottom: 3rem; }
    footer .script { font-size: 2rem; color: var(--green); display: block; }
    @media print {
      body { background: #fff; font-size: 11pt; }
      header { padding: 1.5rem; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .actions { display: none; }
      main { padding-top: 1rem; }
      section { margin-bottom: 1.1rem; }
      li label { padding: .2rem 0; }
    }
  </style>
</head>
<body>
  <header>
    <p class="script">Celebrations</p>
    <p class="sub">by Chanelle</p>
    <h1>Wedding Planning Checklist</h1>
  </header>
  <main>
    <div class="actions">
      <a href="../#resources">&larr; Back to the website</a>
      <button type="button" onclick="window.print()">Print / save as PDF</button>
    </div>

    <section>
      <h2>12–18 months to go</h2>
      <ul>
        <li><label><input type="checkbox"><span>Set your budget and rough guest numbers</span></label></li>
        <li><label><input type="checkbox"><span>Choose your date and book your venue</span></label></li>
        <li><label><input type="checkbox"><span>Book your celebrant (hi! 👋)</span></label></li>
        <li><label><input type="checkbox"><span>Lodge your Notice of Intended Marriage (no earlier than 18 months before)</span></label></li>
        <li><label><input type="checkbox"><span>Book photographer, videographer and any key suppliers</span></label></li>
      </ul>
    </section>

    <section>
      <h2>6–12 months to go</h2>
      <ul>
        <li><label><input type="checkbox"><span>Gather birth certificates / passports and photo ID</span></label></li>
        <li><label><input type="checkbox"><span>If previously married: find your divorce or death certificate</span></label></li>
        <li><label><input type="checkbox"><span>Send save-the-dates</span></label></li>
        <li><label><input type="checkbox"><span>Choose your wedding party and outfits</span></label></li>
        <li><label><input type="checkbox"><span>Book florist, music and hire items</span></label></li>
      </ul>
    </section>

    <section>
      <h2>3–6 months to go</h2>
      <ul>
        <li><label><input type="checkbox"><span>Planning meeting with Chanelle &amp; complete your love-story questionnaire</span></label></li>
        <li><label><input type="checkbox"><span>Pick readings, readers and any rituals (ring warming, handfasting…)</span></label></li>
        <li><label><input type="checkbox"><span>Send invitations</span></label></li>
        <li><label><input type="checkbox"><span>Choose and order rings</span></label></li>
      </ul>
    </section>

    <section>
      <h2>1–2 months to go</h2>
      <ul>
        <li><label><input type="checkbox"><span>NOIM must be lodged by now (at least one month before)</span></label></li>
        <li><label><input type="checkbox"><span>Write your vows (if you're writing your own)</span></label></li>
        <li><label><input type="checkbox"><span>Confirm your two witnesses (18+)</span></label></li>
        <li><label><input type="checkbox"><span>Finalise ceremony running order and music cues</span></label></li>
        <li><label><input type="checkbox"><span>Confirm final numbers with suppliers</span></label></li>
      </ul>
    </section>

    <section>
      <h2>Wedding week</h2>
      <ul>
        <li><label><input type="checkbox"><span>Ceremony rehearsal</span></label></li>
        <li><label><input type="checkbox"><span>Sign your Declaration of No Legal Impediment</span></label></li>
        <li><label><input type="checkbox"><span>Give rings to your ring bearer / best person</span></label></li>
        <li><label><input type="checkbox"><span>Breathe, rest and hydrate!</span></label></li>
      </ul>
    </section>

    <section>
      <h2>After the big day</h2>
      <ul>
        <li><label><input type="checkbox"><span>Chanelle registers your marriage with QLD BDM (within 14 days)</span></label></li>
        <li><label><input type="checkbox"><span>Order your official marriage certificate</span></label></li>
        <li><label><input type="checkbox"><span>Update your name (if changing) — licence, passport, bank, Medicare</span></label></li>
        <li><label><input type="checkbox"><span>Send thank-you notes</span></label></li>
      </ul>
    </section>

    <section>
      <h2>Notes</h2>
      <div class="notes"></div>
    </section>
  </main>
  <footer>
    <span class="script">Love · Legacy · You</span>
    hello@celebrationsbychanelle.com.au · Gold Coast &amp; beyond
  </footer>
</body>
</html>
